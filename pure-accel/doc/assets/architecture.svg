<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300"><title>Ultra-BitNet TP2 board architecture</title><desc>PS software, shared PS DDR, PL event scheduler, operator services, one TP2 compute core, resident tensor storage and five-bank memory hub.</desc><rect x="0" y="0" width="1800" height="1300" fill="white" /><text x="60" y="34" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" dominant-baseline="text-before-edge">Ultra-BitNet</text><text x="60" y="95" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">TP2 Board Architecture  |  AXU3EGB / XCZU3EG-1SFVC784I</text><rect x="60" y="155" width="1680" height="195" rx="8" fill="#f2f6f8" stroke="#c4d0d3" stroke-width="2" /><text x="85" y="172" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" dominant-baseline="text-before-edge">PS  Processing System</text><rect x="110" y="220" width="960" height="95" rx="8" fill="white" stroke="#c4d0d3" stroke-width="2" /><text x="140" y="234" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" dominant-baseline="text-before-edge">Linux Application / bitnetctl / C Runtime</text><text x="140" y="279" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Tokenization / embeddings / model loading / round submission / results</text><rect x="1290" y="220" width="410" height="95" rx="8" fill="#e9f3fa" stroke="#87afcb" stroke-width="2" /><text x="1442.5" y="234" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">PS DDR</text><text x="1363.5" y="278" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge">One shared memory system</text><polyline points="1070,267 1290,267" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="1290,267 1278.0,262.0 1278.0,272.0" fill="#236ea2" /><polygon points="1070,267 1082.0,272.0 1082.0,262.0" fill="#236ea2" /><rect x="60" y="425" width="1680" height="765" rx="8" fill="#fafcfc" stroke="#c4d0d3" stroke-width="2" /><text x="85" y="442" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" dominant-baseline="text-before-edge">PL  BitNet Accelerator</text><text x="85" y="483" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge">Control / memory: 50 MHz</text><rect x="110" y="535" width="960" height="90" rx="8" fill="#eaf5f2" stroke="#87b9ad" stroke-width="2" /><text x="140" y="551" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">Board Interface / ResidentBoardAccelerator</text><text x="140" y="594" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">AXI-Lite registers / hidden PIO / completion and IRQ</text><polyline points="575,315 575,535" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="575,535 580.0,523.0 570.0,523.0" fill="#147d73" /><polygon points="575,315 570.0,327.0 580.0,327.0" fill="#147d73" /><rect x="650" y="366" width="410" height="46" rx="0" fill="white" stroke="white" stroke-width="1" /><text x="665" y="375" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">Commands / 256-bit hidden / status</text><rect x="110" y="680" width="960" height="90" rx="8" fill="#eaf5f2" stroke="#87b9ad" stroke-width="2" /><text x="140" y="696" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">Session / Round Control + Layer Event Scheduler</text><text x="140" y="739" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">30-layer dataflow / completion-driven / identity and fault handling</text><polyline points="575,625 575,680" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="575,680 580.0,668.0 570.0,668.0" fill="#147d73" /><polygon points="575,625 570.0,637.0 580.0,637.0" fill="#147d73" /><rect x="95" y="811" width="1155" height="349" rx="8" fill="#f4f7f8" stroke="#c4d0d3" stroke-width="2" /><text x="119" y="824" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" dominant-baseline="text-before-edge">Compute / On-Chip Storage</text><rect x="125" y="879" width="600" height="105" rx="8" fill="white" stroke="#c4d0d3" stroke-width="2" /><text x="150" y="895" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" dominant-baseline="text-before-edge">Operator Services and Data Paths</text><text x="150" y="936" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">Matrix / Attention / RMS / RoPE / Quant / FFN / LM</text><rect x="790" y="879" width="425" height="105" rx="8" fill="#e9f3fa" stroke="#87afcb" stroke-width="2" /><text x="857.015625" y="895" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" dominant-baseline="text-before-edge">Unified Resident Tensor</text><text x="855.0" y="938" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">Activation / Projection / Query / LM</text><polyline points="725,931 790,931" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="790,931 778.0,926.0 778.0,936.0" fill="#236ea2" /><polygon points="725,931 737.0,936.0 737.0,926.0" fill="#236ea2" /><polyline points="425,770 425,879" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="425,879 430.0,867.0 420.0,867.0" fill="#147d73" /><polygon points="425,770 420.0,782.0 430.0,782.0" fill="#147d73" /><rect x="125" y="1040" width="600" height="96" rx="8" fill="#eaf5f2" stroke="#87b9ad" stroke-width="2" /><text x="150" y="1053" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" dominant-baseline="text-before-edge">Shared Compute Resources</text><text x="150" y="1096" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">1 x TP2 DSP core / 100 MHz / 4 SPUs</text><polyline points="425,984 425,1040" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="425,1040 430.0,1028.0 420.0,1028.0" fill="#147d73" /><polygon points="425,984 420.0,996.0 430.0,996.0" fill="#147d73" /><rect x="790" y="1040" width="425" height="96" rx="8" fill="#e9f3fa" stroke="#87afcb" stroke-width="2" /><text x="855.0078125" y="1053" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" dominant-baseline="text-before-edge">Shared Weight Tile Cache</text><text x="869.5" y="1096" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge">Matrix / LM dual-slot weights</text><polyline points="790,1088 725,1088" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="725,1088 737.0,1093.0 737.0,1083.0" fill="#236ea2" /><polygon points="790,1088 778.0,1083.0 778.0,1093.0" fill="#236ea2" /><rect x="1320" y="680" width="380" height="456" rx="8" fill="#e9f3fa" stroke="#87afcb" stroke-width="2" /><text x="1365.5" y="711" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">Five-Bank Memory Hub</text><text x="1394.75" y="767" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Arbitration / ownership</text><text x="1348.25" y="812" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">AXI tags / read-write responses</text><text x="1377.5" y="857" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Compute / staging quotas</text><text x="1427.25" y="929" fill="#236ea2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">bank 0 -&gt; HPC0</text><text x="1409.25" y="974" fill="#236ea2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">banks 1-4 -&gt; HP0-3</text><text x="1392.5" y="1064" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge">Five ports share PS DDR</text><polyline points="1495,315 1495,680" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="1495,680 1500.0,668.0 1490.0,668.0" fill="#236ea2" /><polygon points="1495,315 1490.0,327.0 1500.0,327.0" fill="#236ea2" /><rect x="1300" y="372" width="415" height="43" rx="0" fill="white" stroke="white" stroke-width="1" /><text x="1381.26171875" y="381" fill="#236ea2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">5 x 128-bit AXI / 50 MHz</text><polyline points="725,964 755,964 755,1015 1280,1015 1280,895 1320,895" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="1320,895 1308.0,890.0 1308.0,900.0" fill="#236ea2" /><polygon points="725,964 737.0,969.0 737.0,959.0" fill="#236ea2" /><text x="805" y="995" fill="#236ea2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">KV / activation / staging</text><polyline points="1215,1088 1320,1088" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="1320,1088 1308.0,1083.0 1308.0,1093.0" fill="#236ea2" /><polygon points="1215,1088 1227.0,1093.0 1227.0,1083.0" fill="#236ea2" /><polyline points="90,1240 155,1240" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="155,1240 143.0,1235.0 143.0,1245.0" fill="#147d73" /><polygon points="90,1240 102.0,1245.0 102.0,1235.0" fill="#147d73" /><text x="170" y="1227" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">Commands / completion / compute</text><polyline points="620,1240 685,1240" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="685,1240 673.0,1235.0 673.0,1245.0" fill="#236ea2" /><polygon points="620,1240 632.0,1245.0 632.0,1235.0" fill="#236ea2" /><text x="700" y="1227" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">Data access</text><text x="1040" y="1227" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">Common MMCM: related 50 / 100 MHz clocks</text></svg>