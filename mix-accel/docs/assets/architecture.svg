<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290"><title>Ultra-BitNet mix-accel architecture</title><desc>PS-managed inference with DMA-connected GEMV and Attention kernels. A separate dual-GEMV topology supports PL DDR and split PS/PL DDR packet storage.</desc><rect x="0" y="0" width="1800" height="1290" fill="white" /><text x="60" y="34" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" dominant-baseline="text-before-edge">Ultra-BitNet / mix-accel</text><text x="60" y="96" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">PS-Orchestrated Inference  |  AXU3EGB / Zynq UltraScale+ MPSoC</text><rect x="60" y="170" width="410" height="170" rx="8" fill="#f2f6f8" stroke="#c4d0d3" stroke-width="2" /><text x="85" y="192" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">Host Tools</text><text x="85" y="246" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Prompt / token utilities</text><text x="85" y="289" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">JTAG / serial / JSON bridge</text><rect x="570" y="170" width="650" height="170" rx="8" fill="#eaf5f2" stroke="#87b9ad" stroke-width="2" /><text x="595" y="192" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">PS Inference Runtime</text><text x="595" y="246" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Linux or bare-metal / tokenizer / embeddings</text><text x="595" y="289" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Layer scheduling / dispatch / token generation</text><rect x="1320" y="170" width="420" height="170" rx="8" fill="#e9f3fa" stroke="#87afcb" stroke-width="2" /><text x="1345" y="192" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">PS DDR</text><text x="1345" y="246" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Model data / KV cache</text><text x="1345" y="289" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Activations / DMA buffers</text><polyline points="470,255 570,255" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="570,255 558.0,250.0 558.0,260.0" fill="#147d73" /><polygon points="470,255 482.0,260.0 482.0,250.0" fill="#147d73" /><polyline points="1220,255 1320,255" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="1320,255 1308.0,250.0 1308.0,260.0" fill="#236ea2" /><polygon points="1220,255 1232.0,260.0 1232.0,250.0" fill="#236ea2" /><rect x="570" y="400" width="650" height="110" rx="8" fill="#f2f6f8" stroke="#c4d0d3" stroke-width="2" /><text x="595" y="419" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">CPU-Side Kernels</text><text x="595" y="463" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">Pre/post-processing / LM head / sampling</text><polyline points="895,340 895,400" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="895,400 900.0,388.0 890.0,388.0" fill="#147d73" /><polygon points="895,340 890.0,352.0 900.0,352.0" fill="#147d73" /><rect x="60" y="620" width="1680" height="400" rx="8" fill="#fafcfc" stroke="#c4d0d3" stroke-width="2" /><text x="595" y="642" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">PL  GEMV + Attention Topology</text><rect x="110" y="720" width="390" height="205" rx="8" fill="#e9f3fa" stroke="#87afcb" stroke-width="2" /><text x="135" y="742" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">AXI DMA</text><text x="135" y="795" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">MM2S input packets</text><text x="135" y="842" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">S2MM compute results</text><text x="135" y="889" fill="#236ea2" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge">DDR &lt;-&gt; AXI Stream</text><rect x="600" y="766" width="265" height="124" rx="8" fill="#f2f6f8" stroke="#c4d0d3" stroke-width="2" /><text x="625" y="787" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" dominant-baseline="text-before-edge">Stream Router</text><text x="625" y="839" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">Packet dispatch</text><rect x="995" y="705" width="690" height="115" rx="8" fill="#eaf5f2" stroke="#87b9ad" stroke-width="2" /><text x="1020" y="725" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">GEMV / Batched Matrix Kernel</text><text x="1020" y="771" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">RTL / packed ternary weights / int8 activations</text><rect x="995" y="875" width="690" height="115" rx="8" fill="#eaf5f2" stroke="#87b9ad" stroke-width="2" /><text x="1020" y="895" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">Attention Kernel</text><text x="1020" y="941" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">HLS / query-key scores / softmax / value reduction</text><polyline points="640,340 640,370 245,370 245,720" fill="none" stroke="#147d73" stroke-width="3" /><polygon points="245,720 250.0,708.0 240.0,708.0" fill="#147d73" /><polygon points="640,340 635.0,352.0 645.0,352.0" fill="#147d73" /><text x="78" y="435" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">DMA control</text><text x="78" y="470" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">and completion</text><polyline points="1500,340 1500,565 390,565 390,720" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="390,720 395.0,708.0 385.0,708.0" fill="#236ea2" /><polygon points="1500,340 1495.0,352.0 1505.0,352.0" fill="#236ea2" /><text x="890" y="532" fill="#236ea2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge">Memory reads / result writes</text><polyline points="500,828 600,828" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="600,828 588.0,823.0 588.0,833.0" fill="#236ea2" /><polygon points="500,828 512.0,833.0 512.0,823.0" fill="#236ea2" /><polyline points="865,805 920,805 920,763 995,763" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="995,763 983.0,758.0 983.0,768.0" fill="#236ea2" /><polygon points="865,805 877.0,810.0 877.0,800.0" fill="#236ea2" /><polyline points="865,852 950,852 950,933 995,933" fill="none" stroke="#236ea2" stroke-width="3" /><polygon points="995,933 983.0,928.0 983.0,938.0" fill="#236ea2" /><polygon points="865,852 877.0,857.0 877.0,847.0" fill="#236ea2" /><rect x="60" y="1080" width="1680" height="130" rx="8" fill="#f2f6f8" stroke="#c4d0d3" stroke-width="2" /><text x="85" y="1100" fill="#18272b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">Separate Dual-GEMV Variant</text><text x="85" y="1147" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">DMA0 + DMA1 -&gt; dual-lane GEMV; packet cache in PL DDR or split PS/PL DDR; results return to PS DDR.</text><text x="85" y="1242" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge">Green: software control / coordination     Blue: payload traffic     Local FIFOs, resets, and individual signals omitted.</text></svg>